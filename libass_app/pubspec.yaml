name: libass_app
description: LIBASS — AI Personal Stylist. Cross-platform mobile app.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.0.7
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  shared_preferences: ^2.2.2
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
